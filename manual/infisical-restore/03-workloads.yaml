# Expects plain Secrets infisical-secrets and postgres-credentials in infisical-restore, built from password-manager values.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: infisical-restore
spec:
  ports:
    - port: 5432
  selector:
    app.kubernetes.io/name: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: infisical-restore
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: postgres
          image: postgres:17.11
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: infisical-restore
spec:
  ports:
    - port: 6379
  selector:
    app.kubernetes.io/name: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: infisical-restore
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: redis
          image: redis:7.4.12
          args: ["redis-server", "--maxmemory-policy", "noeviction"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infisical
  namespace: infisical-restore
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: infisical
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infisical
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: infisical
          image: infisical/infisical:v0.167.0
          envFrom:
            - secretRef:
                name: infisical-secrets
          # Reached via kubectl port-forward, so plain HTTP on localhost.
          env:
            - name: SITE_URL
              value: http://localhost:8080
            - name: HTTPS_ENABLED
              value: "false"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/status
              port: 8080
          resources:
            limits:
              memory: 1Gi
