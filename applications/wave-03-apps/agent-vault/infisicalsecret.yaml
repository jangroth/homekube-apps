apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: agent-vault-proxy-token
  namespace: agent-vault
spec:
  syncConfig:
    resyncInterval: 1m
  authentication:
    kubernetesAuth:
      # homekube-main terraform/infisical: terraform output identity_ids
      identityId: 3afd7387-083d-40d9-b620-5f42f6bb7652
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: agent-vault
      secretsScope:
        projectSlug: agent-vault
        envSlug: prod
        secretsPath: /
  managedKubeSecretReferences:
    - secretName: agent-vault-proxy-token
      secretNamespace: agent-vault
      creationPolicy: Owner
  tls:
    caRef:
      secretName: infisical-tls
      secretNamespace: infisical
      key: ca.crt
