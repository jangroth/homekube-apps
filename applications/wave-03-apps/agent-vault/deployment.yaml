apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-vault-proxy
  namespace: agent-vault
  labels:
    app.kubernetes.io/name: agent-vault-proxy
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-vault-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-vault-proxy
    spec:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: infisical/cli:0.44.15
          imagePullPolicy: IfNotPresent
          args:
            - agent-vault
            - proxy
            - --data-dir
            - /data
            - --log-format
            - json
            # Never debug: passthrough requests are logged with their path in clear.
            - --log-level
            - info
          env:
            - name: INFISICAL_DOMAIN
              value: http://infisical.infisical.svc:8080/api
            - name: INFISICAL_DISABLE_TELEMETRY
              value: "1"
            - name: INFISICAL_AGENT_VAULT_PROXY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-vault-proxy-token
                  key: INFISICAL_AGENT_VAULT_PROXY_TOKEN
          ports:
            - name: proxy
              containerPort: 17323
              protocol: TCP
          # Unauthenticated, answered only once settings and CA are loaded.
          readinessProbe:
            httpGet:
              path: /_agent-vault/ca
              port: proxy
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: proxy
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 128Mi
              cpu: 200m
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
