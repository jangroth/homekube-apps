apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: hermes-tailscale-state
      jsonPointers:
        - /data
  source:
    repoURL: https://github.com/jangroth/herminator.git
    path: chart
    targetRevision: HEAD
    helm:
      valuesObject:
        image:
          # renovate: datasource=docker depName=nousresearch/hermes-agent
          tag: v0.23.4
        tailscale:
          # renovate: datasource=docker depName=tailscale/tailscale
          tag: v1.104.7
        stateExport:
          betterleaks:
            # renovate: datasource=docker depName=ghcr.io/betterleaks/betterleaks
            tag: v1.10.1
        # Agent Vault proxy (spec 010); see README "Agent Vault proxy".
        agentVault:
          encryptedHttpsProxy: 
          # SHA256 66:D6:6B:70:2E:CD:73:09:9E:5F:E9:BD:58:E8:F0:94:20:1F:7F:5B:43:5E:06:BC:77:C5:5E:1F:82:98:4F:5E
