apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: hermes-tailscale-state
      jsonPointers:
        - /data
  source:
    repoURL: https://github.com/jangroth/herminator.git
    path: chart
    targetRevision: HEAD
    helm:
      valuesObject:
        image:
          # renovate: datasource=docker depName=nousresearch/hermes-agent
          tag: v0.22.2
        tailscale:
          # renovate: datasource=docker depName=tailscale/tailscale
          tag: v1.104.2
        stateExport:
          betterleaks:
            # renovate: datasource=docker depName=ghcr.io/betterleaks/betterleaks
            tag: v1.9.0
        # Agent Vault proxy (spec 010); see README "Agent Vault proxy".
        agentVault:
          encryptedHttpsProxy: 
          # SHA256 60:79:EB:CE:9D:7B:89:8C:B0:5F:B1:C2:0A:9D:AD:2B:81:B3:34:E4:C6:1A:5B:0B:04:77:2D:9B:A5:A1:8B:CF
