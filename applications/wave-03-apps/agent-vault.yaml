apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-vault
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: agent-vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # Plain manifests, no chart — see spec 010.
  source:
    repoURL: https://github.com/jangroth/homekube-apps.git
    path: applications/wave-03-apps/agent-vault
    targetRevision: HEAD
