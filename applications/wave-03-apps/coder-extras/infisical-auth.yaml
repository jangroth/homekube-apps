# Only the operator uses this service account's token; no Coder pod mounts it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infisical-auth
  namespace: coder
---
# Infisical Kubernetes Auth reviews the client's own token.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: coder-infisical-auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: infisical-auth
    namespace: coder
