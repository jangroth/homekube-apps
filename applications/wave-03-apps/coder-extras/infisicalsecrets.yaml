apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: coder-secrets
  namespace: coder
spec:
  syncConfig:
    resyncInterval: 1m
  authentication:
    kubernetesAuth:
      # homekube-main terraform/infisical: terraform output identity_ids
      identityId: 822a12be-e501-4b2c-910c-b9c42b3b6e68
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: coder
      secretsScope:
        projectSlug: coder
        envSlug: prod
        secretsPath: /coder
  managedKubeSecretReferences:
    - secretName: coder-secrets
      secretNamespace: coder
      creationPolicy: Owner
  tls:
    caRef:
      secretName: infisical-tls
      secretNamespace: infisical
      key: ca.crt
---
