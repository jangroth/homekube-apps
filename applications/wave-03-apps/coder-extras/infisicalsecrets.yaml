---
# Lives beside its Secret: an owner reference can't cross namespaces.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: agent-vault-session
  namespace: coder-workspaces
spec:
  syncConfig:
    resyncInterval: 1m
  authentication:
    kubernetesAuth:
      identityId: 822a12be-e501-4b2c-910c-b9c42b3b6e68
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: coder
      secretsScope:
        projectSlug: coder
        envSlug: prod
        secretsPath: /agent-vault-session
  managedKubeSecretReferences:
    - secretName: agent-vault-session
      secretNamespace: coder-workspaces
      creationPolicy: Owner
  tls:
    caRef:
      secretName: infisical-tls
      secretNamespace: infisical
      key: ca.crt
