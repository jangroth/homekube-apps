apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: coder-tls
  namespace: coder
spec:
  secretName: coder-tls
  duration: 8760h
  renewBefore: 720h
  issuerRef:
    name: homekube-ca
    kind: ClusterIssuer
  dnsNames:
    - coder.coder.svc
    - coder.coder.svc.cluster.local
  ipAddresses:
    - 192.168.86.248
