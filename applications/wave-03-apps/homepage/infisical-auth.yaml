# Only the operator uses this service account's token; Homepage's own pod never mounts it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infisical-auth
  namespace: homepage
---
# Infisical Kubernetes Auth reviews the client's own token.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage-infisical-auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: infisical-auth
    namespace: homepage
