# Homepage config files, mounted verbatim at /app/config.
# Editing the dashboard = editing this file + ArgoCD sync.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
data:
  # docker.yaml / custom.css / custom.js are unused but must exist: /app/config
  # is a read-only configMap mount, and homepage crashes trying to skeleton-copy
  # any missing config file into it (EROFS).
  docker.yaml: ""
  proxmox.yaml: ""
  custom.css: ""
  custom.js: ""
  settings.yaml: |
    title: homekube
    headerStyle: clean
    # Placeholder background (from the gethomepage docs example) — swap at will.
    background:
      image: https://images.unsplash.com/photo-1502790671504-542ad42d5189?auto=format&fit=crop&w=2560&q=80
      blur: sm
      saturate: 50
      brightness: 50
      opacity: 50
    cardBlur: sm
    statusStyle: dot
    target: _blank
    useEqualHeights: true
    hideVersion: true
    quicklaunch:
      searchDescriptions: true
      provider: duckduckgo
    layout:
      Health:
        style: row
        columns: 4
      GitOps:
      Storage:
      Observability:
      Identity:
      AI:
      Repos:
      Docs:
    # Info widgets (longhorn) read their backend from providers, not widgets.yaml.
    providers:
      longhorn:
        url: http://longhorn-frontend.longhorn-system.svc
  kubernetes.yaml: |
    mode: cluster
  widgets.yaml: |
    - search:
        provider: duckduckgo
        target: _blank
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: homekube
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    # Longhorn is an *info* widget in homepage, not a service widget.
    # Its URL lives in settings.yaml under providers.
    - longhorn:
        expanded: true
        total: true
        labels: true
        nodes: false
    - openmeteo:
        label: Cronulla
        latitude: -34.06
        longitude: 151.15
        timezone: Australia/Sydney
        units: metric
        cache: 5
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short
          hour12: false
  services.yaml: |
    # Static only: homepage discovers Ingress/HTTPRoute annotations, not Services.
    - Health:
        - Cluster health:
            icon: mdi-heart-pulse
            href: http://pi0:30004
            widget:
              type: prometheusmetric
              url: http://prometheus-kube-prometheus-prometheus.observability.svc:9090
              refreshInterval: 30000
              metrics:
                - label: Firing alerts
                  query: 'count(ALERTS{alertstate="firing",alertname!~"Watchdog|InfoInhibitor"}) or vector(0)'
                  format:
                    type: number
                - label: Nodes not ready
                  query: 'count(kube_node_status_condition{condition="Ready",status="true"} == 0) or vector(0)'
                  format:
                    type: number
                - label: Unhealthy volumes
                  query: 'count(longhorn_volume_robustness == 2 or longhorn_volume_robustness == 3) or vector(0)'
                  format:
                    type: number
                - label: Pods not running
                  query: 'sum(kube_pod_status_phase{phase=~"Pending|Failed|Unknown"}) or vector(0)'
                  format:
                    type: number
    - GitOps:
        - ArgoCD:
            icon: argo-cd.png
            href: https://192.168.86.241
            siteMonitor: https://argocd-server.argocd.svc
            description: GitOps controller
            widget:
              type: argocd
              url: https://argocd-server.argocd.svc
              key: "{{HOMEPAGE_VAR_ARGOCD_TOKEN}}"
    - Storage:
        - Longhorn:
            icon: longhorn.png
            href: http://192.168.86.242
            siteMonitor: http://longhorn-frontend.longhorn-system.svc
            description: Distributed block storage
    - Observability:
        - Grafana:
            icon: grafana.png
            href: https://192.168.86.243
            siteMonitor: https://prometheus-grafana.observability.svc
            description: Dashboards
        - Prometheus:
            icon: prometheus.png
            href: http://pi0:30002
            siteMonitor: http://prometheus-kube-prometheus-prometheus.observability.svc:9090/-/healthy
            description: Metrics
            widget:
              type: prometheus
              url: http://prometheus-kube-prometheus-prometheus.observability.svc:9090
        - Alertmanager:
            icon: alertmanager.png
            href: http://pi0:30004
            siteMonitor: http://prometheus-kube-prometheus-alertmanager.observability.svc:9093/-/healthy
            description: Alert routing
    - Identity:
        - Dex:
            icon: https://raw.githubusercontent.com/dexidp/dex/master/docs/logos/dex-glyph-color.png
            href: https://pi0.taild13083.ts.net/dex
            siteMonitor: http://dex.dex.svc:5556/dex/healthz
            description: OIDC federation (Google)
    - AI:
        - Hermes:
            icon: mdi-robot-outline
            href: https://192.168.86.246
            siteMonitor: https://hermes.hermes.svc
            description: Hermes Agent (Dex login)
  bookmarks.yaml: |
    - Repos:
        - homekube:
            - icon: github.png
              href: https://github.com/jangroth/homekube
        - homekube-apps:
            - icon: github.png
              href: https://github.com/jangroth/homekube-apps
        - homekube-main:
            - icon: github.png
              href: https://github.com/jangroth/homekube-main
        - herminator:
            - icon: github.png
              href: https://github.com/jangroth/herminator
        - herminator-state:
            - icon: github.png
              href: https://github.com/jangroth/herminator-state
    - Docs:
        - Homepage:
            - icon: homepage.png
              href: https://gethomepage.dev
