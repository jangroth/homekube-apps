apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: homepage-widget-secrets
  namespace: homepage
spec:
  syncConfig:
    resyncInterval: 1m
  authentication:
    kubernetesAuth:
      # homekube-main terraform/infisical: terraform output identity_ids
      identityId: 00b45952-3344-4daf-a7b6-8a5c90260317
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: homepage
      secretsScope:
        projectSlug: homepage
        envSlug: prod
        secretsPath: /
  managedKubeSecretReferences:
    - secretName: homepage-widget-secrets
      secretNamespace: homepage
      creationPolicy: Owner
  tls:
    caRef:
      secretName: infisical-tls
      secretNamespace: infisical
      key: ca.crt
