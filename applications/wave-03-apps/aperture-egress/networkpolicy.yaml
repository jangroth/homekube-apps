apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aperture-egress
  namespace: aperture-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aperture-egress
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: coder-workspaces
      ports:
        - port: 8080
          protocol: TCP
