apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: aperture-egress-tailscale
  namespace: aperture-egress
spec:
  syncConfig:
    resyncInterval: 1m
  authentication:
    kubernetesAuth:
      # homekube-main terraform/infisical: terraform output identity_ids
      identityId: 0e66ab30-574e-446b-9cb6-34a2bae46cbc
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: aperture-egress
      secretsScope:
        projectSlug: aperture-egress
        envSlug: prod
        secretsPath: /
  managedKubeSecretReferences:
    - secretName: aperture-egress-tailscale
      secretNamespace: aperture-egress
      creationPolicy: Owner
  tls:
    caRef:
      secretName: infisical-tls
      secretNamespace: infisical
      key: ca.crt
