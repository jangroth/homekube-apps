apiVersion: v1
kind: ServiceAccount
metadata:
  name: aperture-egress
  namespace: aperture-egress
  labels:
    app.kubernetes.io/name: aperture-egress
---
# Pre-created: RBAC resourceNames can't constrain `create`.
apiVersion: v1
kind: Secret
metadata:
  name: aperture-egress-tailscale-state
  namespace: aperture-egress
  labels:
    app.kubernetes.io/name: aperture-egress
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aperture-egress-tailscale-state
  namespace: aperture-egress
  labels:
    app.kubernetes.io/name: aperture-egress
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["aperture-egress-tailscale-state"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aperture-egress-tailscale-state
  namespace: aperture-egress
  labels:
    app.kubernetes.io/name: aperture-egress
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aperture-egress-tailscale-state
subjects:
  - kind: ServiceAccount
    name: aperture-egress
    namespace: aperture-egress
