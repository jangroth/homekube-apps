apiVersion: apps/v1
kind: Deployment
metadata:
  name: aperture-egress
  namespace: aperture-egress
  labels:
    app.kubernetes.io/name: aperture-egress
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 1
  # Two pods must never share one tailnet state Secret.
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: aperture-egress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aperture-egress
    spec:
      serviceAccountName: aperture-egress
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31.7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 64Mi
              cpu: 200m
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp

        - name: tailscale
          image: tailscale/tailscale:v1.104.7
          imagePullPolicy: IfNotPresent
          env:
            # Only a first join reads it; with saved state the pod starts without it.
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: aperture-egress-tailscale
                  key: TS_AUTHKEY
                  optional: true
            - name: TS_KUBE_SECRET
              value: aperture-egress-tailscale-state
            - name: TS_HOSTNAME
              value: homekube-aperture-egress
            # Userspace mode would leave nginx without a route to the tailnet.
            - name: TS_USERSPACE
              value: "false"
            # Outbound only; never --accept-routes, which would send the LB VIPs over the tailnet.
            - name: TS_EXTRA_ARGS
              value: "--shields-up"
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 128Mi
              cpu: 200m
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
      volumes:
        - name: nginx-config
          configMap:
            name: aperture-egress-nginx
        - name: tmp
          emptyDir: {}
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
