apiVersion: v1
kind: Service
metadata:
  name: infisical-https
  namespace: infisical
  annotations:
    io.cilium/lb-ipam-ips: "192.168.86.247"
spec:
  type: LoadBalancer
  ports:
    - name: https
      port: 443
      protocol: TCP
      targetPort: 8443
  selector:
    app: infisical-standalone
    component: infisical
    release: infisical
