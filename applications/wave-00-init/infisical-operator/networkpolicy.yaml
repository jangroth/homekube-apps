# Cilium policy: a plain NetworkPolicy ipBlock doesn't match the kube-apiserver identity.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: infisical-operator
  namespace: infisical-operator
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: secrets-operator
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: infisical
            app: infisical-standalone
            component: infisical
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
