apiVersion: v1
kind: Service
metadata:
  name: cst-argocd-server
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/instance: argocd
    app.kubernetes.io/component: server
    app.kubernetes.io/managed-by: argocd
  annotations:
    io.cilium/lb-ipam-ips: "192.168.86.241"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "ArgoCD"
    gethomepage.dev/description: "GitOps controller"
    gethomepage.dev/group: "GitOps"
    gethomepage.dev/icon: "argo-cd.png"
    gethomepage.dev/href: "https://192.168.86.241"
    gethomepage.dev/widget.type: "argocd"
    gethomepage.dev/widget.url: "https://argocd-server.argocd.svc"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_ARGOCD_TOKEN}}"
spec:
  type: LoadBalancer
  ports:
    - port: 443
      protocol: TCP
      targetPort: 8080
  selector:
    app.kubernetes.io/instance: argocd
    app.kubernetes.io/name: argocd-server
status:
  loadBalancer: {}
